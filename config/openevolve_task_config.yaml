# OpenEvolve configuration for AgentSociety CrewAI agent prompt evolution
# Initial program : config/tasks_evolving.yaml
# Evaluator       : openevolve_evaluator_tasks.py
# Run command     :
#   uv run openevolve config/tasks_evolving.yaml openevolve_evaluator_tasks.py \
#     --config config/openevolve_config.yaml \
#     --output config/openevolve_output

# ── General ───────────────────────────────────────────────────────────────────
max_iterations: 50
checkpoint_interval: 5
log_level: "INFO"
random_seed: 42

# ── Evolution strategy ────────────────────────────────────────────────────────
# Full-rewrite is recommended for YAML / prompt evolution
# (diff-based mode generates SEARCH/REPLACE patches that easily corrupt YAML structure)
diff_based_evolution: false
language: "text"
max_code_length: 10000

# ── LLM ───────────────────────────────────────────────────────────────────────
llm:
  models:
    - name: "minimaxai/minimax-m2.7"
      weight: 1.0
  api_base: "https://integrate.api.nvidia.com/v1"
  api_key: null          # reads from OPENAI_API_KEY env variable
  temperature: 0.7
  max_tokens: 4096
  timeout: 300
  retries: 5
  retry_delay: 60

# ── Prompt ────────────────────────────────────────────────────────────────────
prompt:
  system_message: |
    You are an expert prompt engineer specializing in multi-agent AI systems.
    You are evolving the task definitions (description and expected_output) for two CrewAI agents
    that simulate user behavior on a review platform:

    1. analyze_preference_task – instructions for the psychological_analyst.
    2. simulate_review_task – instructions for the behavior_simulator.

    Your goal is to rewrite the EVOLVE-BLOCK section so that the agents produce
    star ratings closer to the user's actual historical average and reviews that
    match the user's typical tone and sentiment.

    Rules:
    - Keep the YAML structure valid. Do NOT change the `agent:` field of any task.
    - Evolve the `description` and `expected_output` fields to improve accuracy.
    - You may restructure the instructions, change formatting, or adjust the "HARD RULES".
    - Return the complete YAML file with EVOLVE-BLOCK-START and EVOLVE-BLOCK-END markers.
  num_top_programs: 3
  num_diverse_programs: 2
  include_artifacts: false

# ── Database ──────────────────────────────────────────────────────────────────
database:
  population_size: 50
  archive_size: 20
  num_islands: 3
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  migration_interval: 10
  migration_rate: 0.1
  feature_dimensions:
    - "complexity"
    - "diversity"

# ── Evaluator ────────────────────────────────────────────────────────────────
evaluator:
  timeout: 3600
  max_retries: 2
  parallel_evaluations: 1
  cascade_evaluation: false
